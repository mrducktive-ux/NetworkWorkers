<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101c2a">
  <title>Railway Infrastructure Simulator</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">RI</div>
        <div><strong>RAILWAY</strong><span>INFRASTRUCTURE SIM</span></div>
      </div>
      <div class="profile-mini">
        <div class="avatar" id="avatar">HC</div>
        <div class="profile-mini-copy"><b id="sideName">New Starter</b><small id="sideRole">Trainee · Infrastructure</small></div>
        <span class="status-dot"></span>
      </div>
      <div class="nav-label">OPERATIONS</div>
      <nav id="mainNav">
        <button class="nav-item active" data-page="dashboard"><span>▦</span> Overview</button>
        <button class="nav-item" data-page="workorders"><span>▤</span> Work orders <i id="openCount">0</i></button>
        <button class="nav-item" data-page="worksite"><span>⚒</span> Worksite simulator</button>
        <button class="nav-item" data-page="departments"><span>▥</span> Departments</button>
        <button class="nav-item" data-page="fleet"><span>▰</span> Fleet & equipment</button>
      </nav>
      <div class="nav-label">DEVELOPMENT</div>
      <nav>
        <button class="nav-item" data-page="academy"><span>▣</span> Training academy</button>
        <button class="nav-item" data-page="career"><span>♙</span> My career</button>
        <button class="nav-item" data-page="management"><span>▧</span> Management</button>
        <button class="nav-item" data-page="records"><span>▤</span> Records & reports</button>
      </nav>
      <div class="nav-label">SYSTEM</div>
      <nav>
        <button class="nav-item" data-page="community"><span>◎</span> Community / Discord</button>
        <button class="nav-item" data-page="settings"><span>⚙</span> Settings</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="network-status"><span class="status-dot"></span><div><b>SIMULATION ONLINE</b><small>Local game session</small></div></div>
        <small class="version">BUILD 0.1.0 · FAN-MADE SIMULATOR</small>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="mobile-menu" id="menuBtn">☰</button>
        <div class="crumb"><span>OPERATIONS CENTRE</span><b>/</b><strong id="pageCrumb">Overview</strong></div>
        <div class="top-actions"><div class="clock" id="gameClock">DAY 01 · 07:30</div><button class="icon-btn" id="helpBtn" title="Help">?</button><div class="top-avatar" id="topAvatar">HC</div></div>
      </header>
      <div class="content" id="content"></div>
    </main>
  </div>
  <div class="toast-region" id="toasts"></div>
  <div class="modal-backdrop hidden" id="modalBackdrop"><section class="modal" id="modal"></section></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
